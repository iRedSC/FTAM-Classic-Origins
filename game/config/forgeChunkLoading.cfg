# Configuration file

# Only Dimensional Anchors may keep chunks loaded; the factions mod holds each faction to its limit of them. Every
# other mod gets no tickets, so its chunk loaders (OpenComputers' upgrade, the Ender Quarry, MFR's Chunk Loader, and
# any added later) do nothing. CustomNPC+ keeps them for staff-placed NPCs, Mekanism for its Teleporter.

DimensionalAnchors {
    I:maximumChunksPerTicket=25
    I:maximumTicketCount=200
}

customnpcs {
    I:maximumChunksPerTicket=25
    I:maximumTicketCount=200
}

Mekanism {
    I:maximumChunksPerTicket=25
    I:maximumTicketCount=200
}

defaults {
    B:enabled=true
    I:maximumChunksPerTicket=25
    # Zero disables chunk loading for every mod without its own section above.
    I:maximumTicketCount=0
    # MFR's Chunk Loader asks per player instead of per mod, so this closes it too. Nothing else uses them.
    I:playerTicketCount=0
    I:dormantChunkCacheSize=0
}
